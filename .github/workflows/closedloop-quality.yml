name: ClosedLoop quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q closedloop tests
      - run: ruff check closedloop tests scripts/check_closedloop_green.py
      - run: python -m pytest -q
      - run: python -m closedloop equilibrium-verify --nr 33 --nz 33 --max-error 0.03
      - run: python -m closedloop run scenarios/baseline_dt.json --output /tmp/closedloop-baseline
